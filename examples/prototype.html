*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg-primary:#0a0e1a;--bg-secondary:#111827;--bg-card:#1a2035;--bg-hover:#1e2a45;
--border:#1e2a45;--border-active:#3b82f6;
--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;
--accent-blue:#3b82f6;--accent-purple:#8b5cf6;--accent-green:#10b981;
--accent-orange:#f59e0b;--accent-red:#ef4444;--accent-cyan:#06b6d4;
--gradient-1:linear-gradient(135deg,#3b82f6,#8b5cf6);
--gradient-2:linear-gradient(135deg,#06b6d4,#3b82f6);
--gradient-3:linear-gradient(135deg,#10b981,#06b6d4);
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-primary);color:var(--text-primary);overflow:hidden;height:100vh}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#475569}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes typing{0%{width:0}100%{width:100%}}
@keyframes blink{0%,100%{border-color:var(--accent-blue)}50%{border-color:transparent}}
@keyframes ripple{0%{transform:scale(0.8);opacity:1}100%{transform:scale(2.4);opacity:0}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes countUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeIn .4s ease-out both}
.slide-in{animation:slideIn .3s ease-out both}
.glow{box-shadow:0 0 20px rgba(59,130,246,.15)}
</style>
</head>

function Badge({children,variant='default'}){
  const colors = {
    default:'background:rgba(59,130,246,.15);color:#60a5fa',
    success:'background:rgba(16,185,129,.15);color:#34d399',
    warning:'background:rgba(245,158,11,.15);color:#fbbf24',
    danger:'background:rgba(239,68,68,.15);color:#f87171',
    purple:'background:rgba(139,92,246,.15);color:#a78bfa',
  };
  return <span style={{...Object.fromEntries(colors[variant].split(';').map(s=>s.split(':').map(v=>v.trim()))),padding:'2px 10px',borderRadius:12,fontSize:11,fontWeight:600,letterSpacing:.3,whiteSpace:'nowrap'}}>{children}</span>;
}

function MetricCard({label,value,change,positive,icon,color}){
  return (
    <div className="animate-in" style={{background:'var(--bg-card)',border:`1px solid ${color}22`,borderRadius:16,padding:'20px 24px',display:'flex',flexDirection:'column',gap:8,position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:-20,right:-20,width:80,height:80,background:`${color}08`,borderRadius:'50%'}}/>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{color:'var(--text-secondary)',fontSize:13,fontWeight:500}}>{label}</span>
        <div style={{width:36,height:36,borderRadius:10,background:`${color}15`,display:'flex',alignItems:'center',justifyContent:'center',color:color}}>
          {Icons[icon] && React.createElement(Icons[icon])}
        </div>
      </div>
      <div style={{fontSize:28,fontWeight:700,letterSpacing:-.5}}>{value}</div>
      {change && <div style={{fontSize:12,fontWeight:500,color:positive?'var(--accent-green)':'var(--accent-red)',display:'flex',alignItems:'center',gap:4}}>
        {positive ? <Icons.ArrowUp/> : <Icons.ArrowDown/>} {change}
      </div>}
    </div>
  );
}

function ApprovalCard({item,compact}){
  const [expanded,setExpanded] = useState(false);
  const [action,setAction] = useState(null);
  const riskColor = {low:'var(--accent-green)',medium:'var(--accent-orange)',high:'var(--accent-red)'}[item.risk];

  if(action) return (
    <div className="animate-in" style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:14,padding:'16px 20px',display:'flex',alignItems:'center',gap:12}}>
      <div style={{width:32,height:32,borderRadius:8,background:action==='approved'?'rgba(16,185,129,.15)':'rgba(239,68,68,.15)',display:'flex',alignItems:'center',justifyContent:'center'}}>
        {action==='approved'?<Icons.Check/>:<Icons.X/>}
      </div>
      <div>
        <div style={{fontSize:13,fontWeight:600,color:action==='approved'?'var(--accent-green)':'var(--accent-red)'}}>{action==='approved'?'Approved':'Rejected'}</div>
        <div style={{fontSize:12,color:'var(--text-muted)'}}>{item.title}</div>
      </div>
    </div>
  );

  return (
    <div className="animate-in" style={{background:'var(--bg-card)',border:`1px solid ${expanded?'var(--border-active)':'var(--border)'}`,borderRadius:14,padding:compact?'14px 18px':'18px 22px',cursor:'pointer',transition:'all .2s'}} onClick={()=>setExpanded(!expanded)}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,flexWrap:'wrap'}}>
            <Badge variant={item.risk==='high'?'danger':item.risk==='medium'?'warning':'success'}>{item.risk.toUpperCase()}</Badge>
            {item.status==='auto_approved'&&<Badge variant="purple">AUTO-APPROVED</Badge>}
            <span style={{fontSize:11,color:'var(--text-muted)',display:'flex',alignItems:'center',gap:4}}><Icons.Clock/>{item.time}</span>
          </div>
          <div style={{fontSize:14,fontWeight:600,marginBottom:4}}>{item.title}</div>
          <div style={{fontSize:12,color:'var(--text-secondary)'}}>{item.agent} • Confidence: <span style={{color:riskColor,fontWeight:600}}>{item.confidence}%</span></div>
        </div>
        {item.amount && <div style={{fontSize:15,fontWeight:700,color:'var(--text-primary)',whiteSpace:'nowrap'}}>{item.amount}</div>}
      </div>

      {expanded && (
        <div className="animate-in" style={{marginTop:14,paddingTop:14,borderTop:'1px solid var(--border)'}}>
          <div style={{fontSize:13,color:'var(--text-secondary)',lineHeight:1.6,marginBottom:16,background:'var(--bg-secondary)',padding:14,borderRadius:10}}>{item.summary}</div>
          {item.status==='pending' && (
            <div style={{display:'flex',gap:10}}>
              <button onClick={(e)=>{e.stopPropagation();setAction('approved')}} style={{flex:1,padding:'10px 0',background:'var(--accent-green)',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:600,cursor:'pointer',transition:'opacity .2s'}}>Approve</button>
              <button onClick={(e)=>{e.stopPropagation();setAction('rejected')}} style={{flex:1,padding:'10px 0',background:'transparent',color:'var(--accent-red)',border:'1px solid var(--accent-red)',borderRadius:10,fontSize:13,fontWeight:600,cursor:'pointer'}}>Reject</button>
              <button onClick={(e)=>e.stopPropagation()} style={{padding:'10px 16px',background:'transparent',color:'var(--text-secondary)',border:'1px solid var(--border)',borderRadius:10,fontSize:13,fontWeight:500,cursor:'pointer'}}>Ask Agent</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function InlineApproval({data}){
  const [acted,setActed]=useState(null);
  const riskColor = {low:'var(--accent-green)',medium:'var(--accent-orange)',high:'var(--accent-red)'}[data.risk];
  if(acted) return <div style={{padding:'10px 14px',background:acted==='approved'?'rgba(16,185,129,.1)':'rgba(239,68,68,.1)',borderRadius:10,fontSize:13,fontWeight:500,color:acted==='approved'?'var(--accent-green)':'var(--accent-red)',border:`1px solid ${acted==='approved'?'rgba(16,185,129,.2)':'rgba(239,68,68,.2)'}`}}>{acted==='approved'?'✓ Approved':'✗ Rejected'} — {data.title}</div>;
  return (
    <div style={{background:'rgba(59,130,246,.06)',border:'1px solid rgba(59,130,246,.15)',borderRadius:12,padding:14,marginTop:8}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <span style={{fontSize:13,fontWeight:600}}>{data.title}</span>
        {data.amount&&<span style={{fontSize:13,fontWeight:700}}>{data.amount}</span>}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>

function ChatPage(){
  const [messages,setMessages] = useState(chatMessages);
  const [input,setInput] = useState('');
  const [typing,setTyping] = useState(false);
  const bottomRef = useRef(null);

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'})},[messages]);

  const suggestions = ['What are my pending approvals?','Show supply chain anomalies','Draft morning briefing','Run budget variance check'];

  const handleSend = (text) => {
    const msg = text || input;
    if(!msg.trim()) return;
    setMessages(prev=>[...prev,{role:'user',text:msg}]);
    setInput('');
    setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      setMessages(prev=>[...prev,{role:'agent',text:`I'm processing your request: "${msg}"\n\nI've routed this to the relevant department agent. Based on your employee context (L7 Engineering Manager, Budget Authority: ₹5L), I'll tailor the response accordingly.\n\nHere's what I found...`,approval:msg.toLowerCase().includes('approv')?{title:'Pending Approval Item',amount:'₹2,45,000',confidence:94,risk:'low'}:null}]);
    },1800);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 80px)',maxHeight:'calc(100vh - 80px)'}}>
      <div style={{padding:'16px 0 12px',borderBottom:'1px solid var(--border)',marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:36,height:36,borderRadius:10,background:'var(--gradient-1)',display:'flex',alignItems:'center',justifyContent:'center'}}><Icons.Sparkle/></div>
          <div>
            <h3 style={{fontSize:15,fontWeight:600}}>AgentOS Assistant</h3>
            <div style={{fontSize:12,color:'var(--accent-green)',display:'flex',alignItems:'center',gap:4}}><div style={{width:6,height:6,borderRadius:'50%',background:'var(--accent-green)'}}/>6 agents online</div>
          </div>
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:16,paddingRight:8,paddingBottom:16}}>
        {messages.map((m,i)=>(
          <div key={i} className="animate-in" style={{animationDelay:`${i*100}ms`,display:'flex',gap:10,justifyContent:m.role==='user'?'flex-end':'flex-start',maxWidth:m.role==='system'?'100%':'85%',alignSelf:m.role==='user'?'flex-end':'flex-start'}}>
            {m.role!=='user'&&<div style={{width:32,height:32,borderRadius:8,background:m.role==='system'?'var(--gradient-3)':'var(--gradient-1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2}}><Icons.Sparkle/></div>}
            <div style={{background:m.role==='user'?'var(--accent-blue)':'var(--bg-card)',border:m.role==='user'?'none':'1px solid var(--border)',borderRadius:m.role==='user'?'16px 16px 4px 16px':'16px 16px 16px 4px',padding:'12px 16px',fontSize:14,lineHeight:1.6,whiteSpace:'pre-wrap'}}>
              {m.text}
              {m.approval && <InlineApproval data={m.approval}/>}
            </div>
          </div>
        ))}
        {typing && (
          <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
            <div style={{width:32,height:32,borderRadius:8,background:'var(--gradient-1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icons.Sparkle/></div>
            <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'16px 16px 16px 4px',padding:'14px 18px',display:'flex',gap:6}}>
              {[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:'50%',background:'var(--text-muted)',animation:`pulse 1.2s ease-in-out ${i*.2}s infinite`}}/>)}
            </div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {messages.length<=1 && (
        <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
          {suggestions.map(s=>(
            <button key={s} onClick={()=>handleSend(s)} style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:20,padding:'8px 14px',fontSize:12,color:'var(--text-secondary)',cursor:'pointer',transition:'all .2s',whiteSpace:'nowrap'}}>{s}</button>
          ))}
        </div>
      )}

      <div style={{display:'flex',gap:10,padding:'12px 0',borderTop:'1px solid var(--border)'}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} placeholder="Ask anything... (e.g., 'approve MacBook request' or 'what's pending?')" style={{flex:1,background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:12,padding:'12px 16px',fontSize:14,color:'var(--text-primary)',outline:'none'}}/>
        <button onClick={()=>handleSend()} style={{width:46,height:46,borderRadius:12,background:'var(--gradient-1)',border:'none',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><Icons.Send/></button>
      </div>
    </div>
  );
}

            <span style={{fontSize:12,color:'var(--text-muted)'}}>{log.user}</span>

    </div>
  );
}

// ─── Main App ───
function App(){
  const [activePage,setActivePage] = useState('dashboard');
  const [cmdBarOpen,setCmdBarOpen] = useState(false);
  const [cmdQuery,setCmdQuery] = useState('');
  const [notifOpen,setNotifOpen] = useState(false);

  useEffect(()=>{
    const handler = (e)=>{
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();setCmdBarOpen(true);setCmdQuery('')}
      if(e.key==='Escape'){setCmdBarOpen(false);setNotifOpen(false)}
    };
    window.addEventListener('keydown',handler);
    return ()=>window.removeEventListener('keydown',handler);
  },[]);

  const pages = {dashboard:DashboardPage,chat:ChatPage,approvals:ApprovalsPage,agents:AgentsPage,skills:SkillsPage,analytics:AnalyticsPage,audit:AuditPage,automations:AutomationsPage,integrations:IntegrationsPage,settings:SettingsPage};
  const PageComponent = pages[activePage];

  const cmdItems = navItems.filter(n=>n.label.toLowerCase().includes(cmdQuery.toLowerCase()));

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      {/* Sidebar */}
      <div style={{width:240,background:'var(--bg-secondary)',borderRight:'1px solid var(--border)',display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'20px 18px 16px',display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:36,height:36,borderRadius:10,background:'var(--gradient-1)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:14}}>1</div>
          <div>
            <div style={{fontSize:15,fontWeight:700,letterSpacing:-.3}}>AgentOS</div>
            <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500,letterSpacing:.5}}>TATA 1MG</div>
          </div>
        </div>

        <nav style={{flex:1,padding:'4px 10px',display:'flex',flexDirection:'column',gap:2}}>
          {navItems.map(item=>{
            const Icon = Icons[item.icon];
            const active = activePage===item.id;
            return (
              <button key={item.id} onClick={()=>setActivePage(item.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,border:'none',background:active?'rgba(59,130,246,.12)':'transparent',color:active?'var(--accent-blue)':'var(--text-secondary)',cursor:'pointer',fontSize:13,fontWeight:active?600:400,transition:'all .15s',textAlign:'left',position:'relative'}}>
                <Icon/>
                {item.label}
                {item.badge && <span style={{marginLeft:'auto',background:'var(--accent-red)',color:'#fff',fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:10,minWidth:20,textAlign:'center'}}>{item.badge}</span>}
              </button>
            );
          })}
        </nav>

        <div style={{padding:'12px 14px',borderTop:'1px solid var(--border)',margin:'0 10px'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0'}}>
            <div style={{width:32,height:32,borderRadius:8,background:'var(--gradient-2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700}}>PP</div>
            <div>
              <div style={{fontSize:12,fontWeight:500}}>Pankaj Pandey</div>
              <div style={{fontSize:10,color:'var(--text-muted)'}}>Engineering • L7</div>
            </div>
          </div>
        </div>
      </div>

      {/* Main Content */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        {/* Top bar */}
        <div style={{height:56,borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 24px',flexShrink:0}}>
          <button onClick={()=>{setCmdBarOpen(true);setCmdQuery('')}} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 14px',background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:8,cursor:'pointer',color:'var(--text-muted)',fontSize:13,minWidth:240}}>
            <Icons.Search/>
            <span>Search or jump to...</span>
            <span style={{marginLeft:'auto',fontSize:11,background:'var(--bg-secondary)',padding:'2px 6px',borderRadius:4,fontFamily:'monospace'}}>⌘K</span>
          </button>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <button onClick={()=>setNotifOpen(!notifOpen)} style={{position:'relative',width:36,height:36,borderRadius:8,background:'var(--bg-card)',border:'1px solid var(--border)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-secondary)'}}>
              <Icons.Bell/>
              <div style={{position:'absolute',top:6,right:6,width:8,height:8,borderRadius:'50%',background:'var(--accent-red)',border:'2px solid var(--bg-secondary)'}}/>
            </button>
          </div>
        </div>

        {/* Page content */}
        <div style={{flex:1,overflow:'auto',padding:24}}>
          <PageComponent/>
        </div>
      </div>

      {/* Command Bar Modal */}
      {cmdBarOpen && (
        <div onClick={()=>setCmdBarOpen(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',backdropFilter:'blur(4px)',display:'flex',justifyContent:'center',paddingTop:'20vh',zIndex:100}}>
          <div onClick={e=>e.stopPropagation()} style={{width:540,background:'var(--bg-card)',borderRadius:16,border:'1px solid var(--border)',overflow:'hidden',maxHeight:400,boxShadow:'0 25px 50px rgba(0,0,0,.5)'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'14px 18px',borderBottom:'1px solid var(--border)'}}>
              <Icons.Search/>
              <input autoFocus value={cmdQuery} onChange={e=>setCmdQuery(e.target.value)} placeholder="Type a command or search..." style={{flex:1,background:'transparent',border:'none',outline:'none',fontSize:15,color:'var(--text-primary)'}}/>
              <span style={{fontSize:11,color:'var(--text-muted)',background:'var(--bg-secondary)',padding:'3px 8px',borderRadius:4}}>ESC</span>
            </div>
            <div style={{padding:8,maxHeight:300,overflowY:'auto'}}>
              {cmdItems.map(item=>{
                const Icon = Icons[item.icon];
                return (
                  <button key={item.id} onClick={()=>{setActivePage(item.id);setCmdBarOpen(false)}} style={{display:'flex',alignItems:'center',gap:10,width:'100%',padding:'10px 14px',borderRadius:8,border:'none',background:'transparent',cursor:'pointer',color:'var(--text-primary)',fontSize:13,textAlign:'left',transition:'background .1s'}}>
                    <div style={{width:28,height:28,borderRadius:6,background:'var(--bg-secondary)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-muted)'}}><Icon/></div>
                    {item.label}
                    {item.badge && <Badge variant="danger">{item.badge}</Badge>}
                    <span style={{marginLeft:'auto',color:'var(--text-muted)',fontSize:11}}>Navigate</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* Notification Panel */}
      {notifOpen && (
        <div style={{position:'fixed',top:56,right:16,width:360,background:'var(--bg-card)',borderRadius:14,border:'1px solid var(--border)',boxShadow:'0 20px 40px rgba(0,0,0,.4)',zIndex:90,maxHeight:'70vh',overflow:'auto'}}>
          <div style={{padding:'14px 18px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:14,fontWeight:600}}>Notifications</span>
            <span style={{fontSize:11,color:'var(--accent-blue)',cursor:'pointer'}}>Mark all read</span>
          </div>
          {[
            {text:'Duplicate invoice flagged — needs review',time:'1.5 hrs ago',unread:true},
            {text:'Paracetamol reorder triggered',time:'25 min ago',unread:true},
            {text:'MacBook Pro request ready for approval',time:'2 min ago',unread:true},
            {text:'Morning briefing sent to 342 employees',time:'9:55 AM',unread:false},
            {text:'Amit Kumar onboarding completed',time:'10:30 AM',unread:false},
          ].map((n,i)=>(
            <div key={i} style={{padding:'12px 18px',borderBottom:'1px solid var(--border)',display:'flex',gap:10,alignItems:'flex-start',background:n.unread?'rgba(59,130,246,.04)':'transparent',cursor:'pointer'}}>
              {n.unread && <div style={{width:6,height:6,borderRadius:'50%',background:'var(--accent-blue)',marginTop:6,flexShrink:0}}/>}
              <div style={{marginLeft:n.unread?0:16}}>
                <div style={{fontSize:13,color:'var(--text-primary)'}}>{n.text}</div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>{n.time}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
